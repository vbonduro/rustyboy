[package]
name = "rustyboy-pico2w"
version = "0.1.0"
edition = "2021"
default-run = "rustyboy-pico2w"

[lib]
name = "rustyboy_pico2w"
path = "src/lib.rs"

[[bin]]
name = "rustyboy-pico2w"
path = "src/main.rs"
required-features = ["firmware-bin"]
test = false

[[bin]]
name = "menu-preview"
path = "src/bin/menu_preview.rs"
required-features = ["std"]
test = false

[features]
default = ["firmware-bin"]
# Keeps the embedded firmware binary enabled for normal builds while allowing
# host integration tests to exercise the library without compiling ARM-only code.
firmware-bin = []
# Re-exported for display-viewer which depends on this crate.
std = []
# CPU overclock options (clk_sys target). Default boot is 300MHz; see main.rs.
oc-266 = []
oc-280 = []
oc-300 = []
# Log FPS to RTT every 60 frames.
fps = []
# Enable audio output. Off by default; pass --features audio to enable.
audio = []

# ---------------------------------------------------------------------------
# Cross-platform dependencies (compile on any target, including host tests)
# ---------------------------------------------------------------------------
[dependencies]
rustyboy-core = { path = "../../core" }
embedded-graphics = "0.8"

# ---------------------------------------------------------------------------
# Host (non-ARM) only — PNG export for display-viewer and tests
# ---------------------------------------------------------------------------
[target.'cfg(not(target_arch = "arm"))'.dependencies]
png = "0.17"
heapless = { version = "0.9", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["portable-atomic"] }

# ---------------------------------------------------------------------------
# Embedded (ARM bare-metal) only — excluded from host test builds
# ---------------------------------------------------------------------------
[target.'cfg(target_arch = "arm")'.dependencies]
embassy-rp = { git = "https://github.com/embassy-rs/embassy", features = [
    "rp235xa",
    "time-driver",
    "defmt",
    "critical-section-impl",
    "binary-info",
] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
# Clean semihosting exit used by the boot-time .data integrity guard so a
# corrupt image makes `probe-rs run` (and thus `cargo run`) return non-zero
# without going through the fault handler. See `integrity` in main.rs.
cortex-m-semihosting = "0.5"
critical-section = "1.2"
heapless = { version = "0.9", default-features = false }
rp-pac = { git = "https://github.com/embassy-rs/rp-pac", rev = "c2e27609b021c444f634673155318977d7f0bdf6" }

defmt = "1"
defmt-rtt = "1"
# panic-probe removed: crash::handler provides our own #[panic_handler] that
# writes a crash record to scratch registers before resetting.

embedded-alloc = "0.5"
embedded-sdmmc = "0.9.0"
mipidsi = "0.8"
display-interface-spi = "0.5"
embedded-hal-bus = "0.1"
bytemuck = { version = "1", default-features = false }
static_cell = "2.1"

# ---------------------------------------------------------------------------
# WiFi — CYW43439 driver + embassy-net.  ARM-only (this whole section is under
# the arm-target dependencies), so it never affects host test builds and needs
# no feature gate.
# ---------------------------------------------------------------------------
embassy-sync = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }
cyw43 = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }
# Used to build the CYW43 PIO-SPI clock divider at runtime from clk_sys (see
# wifi/driver.rs).  Same major version cyw43-pio depends on, so the FixedU32
# type unifies.
fixed = "1"
embassy-net = { git = "https://github.com/embassy-rs/embassy", features = [
    "defmt", "tcp", "udp", "dhcpv4", "medium-ethernet",
] }
embedded-io-async = { version = "0.7" }
mousefood = { version = "0.5", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["portable-atomic"] }
