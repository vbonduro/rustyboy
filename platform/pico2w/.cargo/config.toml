[target.thumbv8m.main-none-eabihf]
# probe-rs flash + run via SWD/JTAG debug probe.
# For picotool (BOOTSEL / drag-and-drop), see CLAUDE.md.
# RP2350 flash programming has been flaky at the default probe settings on this
# board; failed page writes in the firmware .data load image leave corrupted RAM
# code after boot — and probe-rs --verify has been seen to false-pass it (XIP
# cache). `rb-flash` patches a CRC of the .data image into the ELF, then flashes
# (single-buffered + verify); the firmware self-checks it on boot and exits
# non-zero on mismatch so `cargo run` fails and you can re-run to retry.
#
# Build the runner once:  cargo build -p xtask --release
runner = "../../target/release/rb-flash"

rustflags = [
    # Link against the memory layout defined in memory.x.
    "-C", "link-arg=-Tlink.x",
    # Include defmt symbol table (required for defmt RTT decoding).
    "-C", "link-arg=-Tdefmt.x",
    # Disable the default linker relaxation pass — required for RP235x.
    "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
# Default log level. Override with DEFMT_LOG=trace cargo run etc.
DEFMT_LOG = "debug"

[alias]
# Run unit tests on the host (overrides the default embedded target).
test-host = "test --lib --target x86_64-unknown-linux-gnu"
