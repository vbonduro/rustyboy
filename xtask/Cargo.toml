[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
# `src/bin/rb-flash.rs` is auto-discovered as a second binary alongside the
# explicit `xtask` bin below; without this, `cargo run -p xtask` (and the
# `cargo xtask` alias in the workspace .cargo/config.toml) can't tell which
# one to run.
default-run = "xtask"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# rb-flash binary: parse the firmware ELF to patch the .data integrity CRC.
object = "0.36"
