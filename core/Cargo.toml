[package]
name = "rustyboy-core"
version = "0.1.0"
edition = "2021"

[features]
# Enables per-instruction trace hooks on Sm83. Zero cost when disabled.
# Usage: cargo test --features trace
trace = []

[dependencies]
bitflags = "2.5.0"
bytemuck = { version = "1", default-features = false, features = ["extern_crate_alloc"] }
sha2 = { version = "0.10.9", default-features = false }

[dev-dependencies]
png = "0.17"
